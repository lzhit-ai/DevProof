[project]
name = "devproof-agent-service"
version = "0.1.0"
description = "DevProof isolated Agent runtime and pull-based Worker"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "jsonschema>=4.23,<5", "langgraph>=0.2,<1.0", "tree-sitter-language-pack>=1.6,<2.0", "tree-sitter==0.25.1",
  "fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "pydantic-settings>=2.6,<3.0",
  "beautifulsoup4>=4.12,<5.0", "PyYAML>=6.0,<7.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
